<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Phoneme Synthesizer UI</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
        body { margin: 0; padding: 0; width: 100vw; height: 100vh; background: #121212; color: white; font-family: 'Courier New', monospace; overflow: hidden; display: flex; flex-direction: column; }
        
        /* モニターエリア */
        #monitor { height: 15%; width: 100%; background: #000; border-bottom: 2px solid #333; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: #0f0; text-shadow: 0 0 5px #0f0; }

        /* メイン入力エリア */
        #input-area { display: flex; flex: 1; width: 100%; height: 85%; }
        
        /* 左側：ジョイスティックエリア（母音） */
        #left-zone { width: 35%; height: 100%; position: relative; display: flex; align-items: center; justify-content: center; padding: 10px; border-right: 1px solid #222; }
        #joystick-bound { width: 180px; height: 180px; background: rgba(255,255,255,0.05); border: 2px solid #444; border-radius: 50%; position: relative; }
        #joystick-stick { width: 70px; height: 70px; background: #ff4757; border-radius: 50%; position: absolute; top: 55px; left: 55px; box-shadow: 0 0 15px rgba(255,71,87,0.5); }
        
        /* 母音ラベルの配置 */
        .vowel-label { position: absolute; font-size: 1.2rem; font-weight: bold; color: rgba(255,255,255,0.5); }
        #vowel-a { top: 5px; left: 50%; transform: translateX(-50%); } /* 北 */
        #vowel-i { top: 50%; right: 5px; transform: translateY(-50%); } /* 東 */
        #vowel-u { bottom: 5px; left: 50%; transform: translateX(-50%); } /* 南 */
        #vowel-e { top: 50%; left: 5px; transform: translateY(-50%); } /* 西 */
        #vowel-o { top: 5px; right: 5px; } /* 間（時計回り用） */

        /* 右側：子音ボタンエリア（人・中・薬・小） */
        #right-zone { width: 65%; height: 100%; display: flex; justify-content: space-evenly; align-items: center; padding: 10px 20px; }
        
        .finger-column { display: flex; flex-direction: column; gap: 10px; height: 90%; justify-content: center; }
        .consonant-btn { background: #262626; border: 1px solid #3a3a3a; color: #aaa; font-size: 1.3rem; border-radius: 8px; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; transition: background 0.1s; }
        .consonant-btn:active, .consonant-btn.active { background: #70a1ff; color: #000; border-color: #70a1ff; box-shadow: 0 0 10px #70a1ff; }

        /* 人差し指のｈｊｂｎを少し離す */
        .index-finger-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 15px; } 

    </style>
</head>
<body>

    <div id="monitor">SOUND: - | V: - | C: -</div>

    <div id="input-area">
        <div id="left-zone">
            <div id="joystick-bound">
                <div id="joystick-stick"></div>
                <div class="vowel-label" id="vowel-a">A</div>
                <div class="vowel-label" id="vowel-i">I</div>
                <div class="vowel-label" id="vowel-u">U</div>
                <div class="vowel-label" id="vowel-e">E</div>
                <div class="vowel-label" id="vowel-o">O</div>
            </div>
        </div>

        <div id="right-zone">
            <div class="finger-column">
                <div class="index-finger-group">
                    <div class="consonant-btn" data-sound="y">y</div>
