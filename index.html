<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phoneme Keyboard - Fixed</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
        body { margin: 0; padding: 0; width: 100vw; height: 100vh; background: #121212; color: white; font-family: sans-serif; overflow: hidden; }
        
        #app { display: flex; width: 100%; height: 100%; }
        
        /* 左手エリア：30% */
        #left-zone { 
            width: 30%; 
            height: 100%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-right: 2px solid #333;
            background: #1a1a1a;
            position: relative;
        }
        #joystick-bound { 
            width: 180px; 
            height: 180px; 
            background: #2a2a2a; 
            border: 3px solid #555; 
            border-radius: 50%; 
            position: relative; 
        }
        #joystick-stick { 
            width: 60px; 
            height: 60px; 
            background: #ff4757; 
            border-radius: 50%; 
            position: absolute; 
            top: 57px; 
            left: 57px; 
            pointer-events: none; 
            box-shadow: 0 0 15px rgba(255,71,87,0.6);
        }
        .vowel-hint { position: absolute; font-size: 16px; color: #aaa; font-weight: bold; width: 20px; text-align: center; height: 20px; line-height: 20px; }

        /* 右手エリア：70%（子音） */
        #right-zone { 
            width: 70%; 
            height: 100%; 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            padding: 10px 20px;
            background: #151515;
        }
        
        .finger-column { 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            justify-content: center;
            height: 100%;
        }
        
        /* 人差し指の上下を少し離す隙間 */
        .index-gap { margin-top: 15px; }

        .consonant-btn { 
            background: #2d3436; 
            border: 2px solid #4b5563; 
            color: #dfe4ea; 
            font-size: 18px; 
            font-weight: bold;
            border-radius: 12px; 
            width: 65px; 
            height: 50px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
        }
        .consonant-btn.active { 
            background: #2ed573 !important; 
            color: black; 
            border-color: #2ed573;
            box-shadow: 0 0 10px #2ed573;
        }

        #monitor { 
            position: absolute; 
            top: 10px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: rgba(0,0,0,0.8); 
            padding: 8px 16px; 
            border-radius: 20px; 
            font-family: monospace; 
            font-size: 18px; 
            color: #00ff00;
            z-index: 100;
            border: 1px solid #333;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="monitor">V: - | C: -</div>

    <div id="app">
        <div id="left-zone">
            <div id="joystick-bound">
                <div id="joystick-stick"></div>
                <div class="vowel-hint" style="top: 5px; left: 77px;">a</div>
                <div class="vowel-hint" style="top: 50px; right: 10px;">i</div>
                <div class="vowel-hint" style="bottom: 15px; right: 35px;">u</div>
                <div class="vowel-hint" style="bottom: 15px; left: 35px;">e</div>
                <div class="vowel-hint" style="top: 50px; left: 10px;">o</div>
            </div>
        </div>

        <div id="right-zone">
            <div class="finger-column">
                <div class="consonant-btn" data-sound="y">y</div>
                <div class="consonant-btn" data-sound="h">h</div>
                <div class="consonant-btn" data-sound="j">j</div>
                <div class="consonant-btn index-gap" data-sound="b">b</div>
                <div class="consonant-btn" data-sound="n">n</div>
                <div class="consonant-btn" data-sound="m">m</div>
            </div>

            <div class="finger-column">
                <div class="consonant-btn" data-sound="g">g</div>
                <div class="consonant-btn" data-sound="k">k</div>
            </div>

            <div class="finger-column">
                <div class="consonant-btn" data-sound="r">r</div>
                <div class="consonant-btn" data-sound="s">s</div>
                <div class="consonant-btn" data-sound="z">z</div>
            </div>

            <div class="finger-column">
                <div class="consonant-btn" data-sound="p">p</div>
                <div class="consonant-btn" data-sound="t">t</div>
                <div class="consonant-btn" data-sound="d">d</div>
            </div>
        </div>
    </div>

    <script>
        const monitor = document.getElementById('monitor');
        const stick = document.getElementById('joystick-stick');
        const bound = document.getElementById('joystick-bound');
        const rightZone = document.getElementById('right-zone');
        const buttons = document.querySelectorAll('.consonant-btn');
        
        let currentVowel = "-";
        let currentConsonant = "-";
        const vowels = ["a", "i", "u", "e", "o"];

        // 基準値
        const MAX_RADIUS = 60; // スティックが動ける最大半径(px)
        const CENTER_OFFSET = 57; // スティックの初期位置(top/left)

        function updateMonitor() {
            monitor.innerText = `V: ${currentVowel} | C: ${currentConsonant}`;
        }

        // ================= ジョイスティック（数学的制御） =================
        // 各タッチイベントからこの関数を呼び出す
        function handleJoystick(e) {
            e.preventDefault();
            
            // ジョイスティックの領域（#left-zone）内で発生しているタッチを探す
            let joystickTouch = null;
            for (let i = 0; i < e.touches.length; i++) {
                if (e.touches[i].clientX < window.innerWidth * 0.3) {
                    joystickTouch = e.touches[i];
                    break;
                }
            }
            if (!joystickTouch) return;

            const rect = bound.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            // 中心からの純粋な距離ベクトル
            const dx = joystickTouch.clientX - centerX;
            const dy = joystickTouch.clientY - centerY;
            const distance = Math.sqrt(dx * dx + dy * dy);

            // 角度(ラジアン)を Math.atan2 で取得
            const angleRadian = Math.atan2(dy, dx);

            // 表示上の移動量を計算（MAX_RADIUSを超えないように制御）
            let stickX = dx;
            let stickY = dy;
            if (distance > MAX_RADIUS) {
                stickX = Math.cos(angleRadian) * MAX_RADIUS;
                stickY = Math.sin(angleRadian) * MAX_RADIUS;
            }

            // スティックの位置を更新
            stick.style.transform = `translate(${stickX}px, ${stickY}px)`;

            // --- 5等分の判定 ---
            if (distance > 20) { 
                // 真上(a)を0度とした、時計回りの角度（0〜360度）に変換
                let angleDegree = angleRadian * (180 / Math.PI);
                angleDegree = (angleDegree + 450) % 360; 

                // 72度（360 / 5）ずつで綺麗に5等分
                const index = Math.floor(angleDegree / 72) % 5;
                currentVowel = vowels[index];
            } else {
                currentVowel = "-";
            }
            updateMonitor();
        }

        function resetJoystick(e) {
            // 左側のタッチがなくなったかチェック
            let leftTouchExists = false;
            for (let i = 0; i < e.touches.length; i++) {
                if (e.touches[i].clientX < window.innerWidth * 0.3) {
                    leftTouchExists = true;
                    break;
                }
            }
            if (!leftTouchExists) {
                stick.style.transform = `translate(0px, 0px)`;
                currentVowel = "-";
                updateMonitor();
            }
        }

        // 画面全体で左側のタッチイベントを捕捉（指が外にはみ出しても動くように）
        window.addEventListener('touchstart', (e) => { if (e.touches[0].clientX < window.innerWidth * 0.3) handleJoystick(e); });
        window.addEventListener('touchmove', handleJoystick);
        window.addEventListener('touchend', resetJoystick);
        window.addEventListener('touchcancel', resetJoystick);


        // ================= 子音ボタン（マルチタッチ判定） =================
        function checkButtonsTouch(e) {
            e.preventDefault();
            
            buttons.forEach(btn => btn.classList.remove('active'));
            let activeSound = "-";

            // 全ての指の座標をチェック
            for (let i = 0; i < e.touches.length; i++) {
                const touch = e.touches[i];
                
                // 右手エリア（画面の30%より右側）のタッチのみ処理
                if (touch.clientX >= window.innerWidth * 0.3) {
                    buttons.forEach(btn => {
                        const rect = btn.getBoundingClientRect();
                        if (touch.clientX >= rect.left && touch.clientX <= rect.right &&
                            touch.clientY >= rect.top && touch.clientY <= rect.bottom) {
                            btn.classList.add('active');
                            activeSound = btn.getAttribute('data-sound');
                        }
                    });
                }
            }

            currentConsonant = activeSound;
            updateMonitor();
        }

        rightZone.addEventListener('touchstart', checkButtonsTouch);
        rightZone.addEventListener('touchmove', checkButtonsTouch);
        rightZone.addEventListener('touchend', checkButtonsTouch);
        rightZone.addEventListener('touchcancel', checkButtonsTouch);

    </script>
</body>
</html>
