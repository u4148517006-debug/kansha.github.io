<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phoneme Synthesizer - Perfect Layout & Guide</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
        
        body { 
            margin: 0; 
            padding: 0; 
            width: 100vw; 
            height: 100vh; 
            background: #ffffff; 
            color: #000000; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            overflow: hidden; 
            position: relative;
        }
        
        /* 背面波形 */
        #waveform-canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1; 
            pointer-events: none; 
        }

        /* 前面UIコンテナ（JSでサイズを完全制御） */
        #app { 
            position: absolute;
            top: 0;
            left: 0;
            display: flex; 
            z-index: 2; 
            background: transparent; 
        }
        
        /* 左手エリア：25% */
        #left-zone { 
            width: 25%; 
            height: 100%; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            border-right: 1px solid rgba(0, 0, 0, 0.15);
            background: rgba(255, 255, 255, 0.85); 
            position: relative;
        }

        #monitor-text { 
            font-family: monospace; 
            font-size: 15px; 
            color: #333333;
            margin-bottom: 25px;
            font-weight: 600;
            text-align: center;
            pointer-events: none;
            line-height: 1.4;
        }

        /* ジョイスティック外枠（ガイドラインの土台） */
        #joystick-bound { 
            width: 160px; 
            height: 160px; 
            background: #ffffff; 
            border: 2px solid #b0b0b5; 
            border-radius: 50%; 
            position: relative; 
        }

        /* SVGによる5分割ガイドライン */
        #guide-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* 各領域の真ん中に配置する母音文字 */
        .vowel-hint { 
            position: absolute; 
            font-size: 18px; 
            color: #888888; 
            font-weight: bold; 
            width: 30px; 
            height: 30px; 
            line-height: 30px; 
            text-align: center; 
            pointer-events: none;
        }

        /* 動くスティック */
        #joystick-stick { 
            width: 46px; 
            height: 46px; 
            background: #111111; 
            border-radius: 50%; 
            position: absolute; 
            top: 55px; /* (160 - 46)/2-1 */
            left: 55px; 
            pointer-events: none; 
            z-index: 10;
        }

        /* 右手エリア：75% */
        #right-zone { 
            width: 75%; 
            height: 100%; 
            display: flex; 
            padding: 0; 
            background: transparent; 
        }
        
        .finger-column { 
            display: flex; 
            flex-direction: column; 
            height: 100%;
        }

        .index-double-column {
            display: flex;
            height: 100%;
        }
        .index-sub-column {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* 子音ボタン */
        .consonant-btn { 
            background: rgba(248, 248, 250, 0.85); 
            border: 0.5px solid rgba(0, 0, 0, 0.12); 
            color: #000000; 
            font-size: 24px; 
            font-weight: bold;
            border-radius: 0px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            width: 100%;
        }

        .consonant-btn.active { 
            background: #000000 !important; 
            color: #ffffff; 
            border-color: #000000;
        }
    </style>
</head>
<body>

    <canvas id="waveform-canvas"></canvas>

    <div id="app">
        <div id="left-zone">
            <div id="monitor-text">母音: - <br> 子音: -</div>
            
            <div id="joystick-bound">
                <svg id="guide-lines">
                    <line x1="80" y1="80" x2="127" y2="15" stroke="#e0e0e0" stroke-width="1.5" />
                    <line x1="80" y1="80" x2="156" y2="105" stroke="#e0e0e0" stroke-width="1.5" />
                    <line x1="80" y1="80" x2="127" y2="145" stroke="#e0e0e0" stroke-width="1.5" />
                    <line x1="80" y1="80" x2="33" y2="145" stroke="#e0e0e0" stroke-width="1.5" />
                    <line x1="80" y1="80" x2="4" y2="105" stroke="#e0e0e0" stroke-width="1.5" />
                </svg>

                <div class="vowel-hint" style="top: 12px; left: 65px;">i</div>
                <div class="vowel-hint" style="top: 48px; right: 15px;">u</div>
                <div class="vowel-hint" style="bottom: 18px; right: 32px;">e</div>
                <div class="vowel-hint" style="bottom: 18px; left: 32px;">o</div>
                <div class="vowel-hint" style="top: 48px; left: 15px;">a</div>

                <div id="joystick-stick"></div>
            </div>
        </div>

        <div id="right-zone" class="consonant-grid">
            <div class="index-double-column" id="col-index">
                <div class="index-sub-column">
                    <div class="consonant-btn" data-sound="y">y</div>
                    <div class="consonant-btn" data-sound="h">h</div>
                    <div class="consonant-btn" data-sound="n">n</div>
                </div>
                <div class="index-sub-column">
                    <div class="consonant-btn" data-sound="w">w</div>
                    <div class="consonant-btn" data-sound="j">j</div>
                    <div class="consonant-btn" data-sound="m">m</div>
                </div>
            </div>

            <div class="finger-column" id="col-middle">
                <div class="consonant-btn" data-sound="g">g</div>
                <div class="consonant-btn" data-sound="k">k</div>
                <div class="consonant-btn" data-sound="b">b</div>
            </div>

            <div class="finger-column" id="col-ring">
                <div class="consonant-btn" data-sound="r">r</div>
                <div class="consonant-btn" data-sound="s">s</div>
                <div class="consonant-btn" data-sound="z">z</div>
            </div>

            <div class="finger-column" id="col-little">
                <div class="consonant-btn" data-sound="p">p</div>
                <div class="consonant-btn" data-sound="t">t</div>
                <div class="consonant-btn" data-sound="d">d</div>
            </div>
        </div>
    </div>

    <script>
        const monitorText = document.getElementById('monitor-text');
        const stick = document.getElementById('joystick-stick');
        const bound = document.getElementById('joystick-bound');
        const rightZone = document.getElementById('right-zone');
        const buttons = document.querySelectorAll('.consonant-btn');
        const appContainer = document.getElementById('app');
        
        const canvas = document.getElementById('waveform-canvas');
        const canvasCtx = canvas.getContext('2d');
        
        let currentVowel = "-";
        let currentConsonant = "-";
        const vowels = ["i", "u", "e", "o", "a"];
        const MAX_RADIUS = 50; 

        function updateMonitor() {
            monitorText.innerHTML = `母音: ${currentVowel}<br>子音: ${currentConsonant}`;
        }

        // ================= JSによる厳密な画面等分サイズ計算・配置 =================
        function forceStrictLayout() {
            const h = window.innerHeight;
            const w = window.innerWidth;

            // 1. 全体コンテナのサイズ指定
            document.body.style.height = h + "px";
            appContainer.style.width = w + "px";
            appContainer.style.height = h + "px";

            // 2. キャンバスサイズ指定
            canvas.width = w;
            canvas.height = h;

            // 3. 右手エリアの各列の横幅を比率(2:1:1:1)で正確に分配
            const rightZoneWidth = w * 0.75;
            const unitWidth = rightZoneWidth / 5; // 全5列分（人差し指が2列分）

            document.getElementById('col-index').style.width = (unitWidth * 2) + "px";
            document.getElementById('col-middle').style.width = unitWidth + "px";
            document.getElementById('col-ring').style.width = unitWidth + "px";
            document.getElementById('col-little').style.width = unitWidth + "px";

            // 4. すべてのボタンの高さを「画面全体の高さ ÷ 3」に強制固定
            const btnHeight = h / 3;
            buttons.forEach(btn => {
                btn.style.height = btnHeight + "px";
            });
        }
        window.addEventListener('resize', forceStrictLayout);
        window.addEventListener('orientationchange', forceStrictLayout);
        forceStrictLayout();

        // ================= 音声合成システム =================
        let audioCtx = null;
        let mainGain = null;
        let voiceOsc = null;
        let filter1 = null;
        let filter2 = null;
        let analyser = null; 
        let dataArray = null;
        let bufferLength = 0;

        const formantFrequencies = {
            'i': { f1: 280,  f2: 2250 },
            'u': { f1: 320,  f2: 1200 },
            'e': { f1: 550,  f2: 1850 },
            'o': { f1: 500,  f2: 800  },
            'a': { f1: 750,  f2: 1200 }
        };

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            mainGain = audioCtx.createGain();
            mainGain.gain.setValueAtTime(0, audioCtx.currentTime);

            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 2048; 
            bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength); 

            mainGain.connect(analyser);
            analyser.connect(audioCtx.destination);

            voiceOsc = audioCtx.createOscillator();
            voiceOsc.type = 'sawtooth';
            voiceOsc.frequency.setValueAtTime(130, audioCtx.currentTime);

            filter1 = audioCtx.createBiquadFilter();
            filter1.type = 'bandpass';
            filter1.Q.setValueAtTime(12, audioCtx.currentTime);

            filter2 = audioCtx.createBiquadFilter();
            filter2.type = 'bandpass';
            filter2.Q.setValueAtTime(12, audioCtx.currentTime);

            voiceOsc.connect(filter1);
            voiceOsc.connect(filter2);
            filter1.connect(mainGain);
            filter2.connect(mainGain);

            voiceOsc.start();
            drawWaveform();
        }

        function updateVowelSound(vowel) {
            if (!audioCtx) initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (vowel === "-") {
                mainGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.04);
            } else {
                const freq = formantFrequencies[vowel];
                filter1.frequency.setTargetAtTime(freq.f1, audioCtx.currentTime, 0.04);
                filter2.frequency.setTargetAtTime(freq.f2, audioCtx.currentTime, 0.04);
                mainGain.gain.setTargetAtTime(0.25, audioCtx.currentTime, 0.02); 
            }
        }

        function triggerConsonantSound(consonant) {
            if (!audioCtx) initAudio();
            const now = audioCtx.currentTime;

            if (["s", "k", "t", "p", "h"].includes(consonant)) {
                const bufferSize = audioCtx.sampleRate * 0.08; 
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noiseNode = audioCtx.createBufferSource();
                noiseNode.buffer = buffer;

                const noiseFilter = audioCtx.createBiquadFilter();
                const noiseGain = audioCtx.createGain();

                if (consonant === "s") {
                    noiseFilter.type = "highpass";
                    noiseFilter.frequency.setValueAtTime(6000, now);
                    noiseGain.gain.setValueAtTime(0.25, now);
                } else if (consonant === "h") {
                    noiseFilter.type = "bandpass";
                    noiseFilter.frequency.setValueAtTime(2200, now);
                    noiseGain.gain.setValueAtTime(0.2, now);
                } else { 
                    noiseFilter.type = "bandpass";
                    noiseFilter.frequency.setValueAtTime(1400, now);
                    noiseGain.gain.setValueAtTime(0.35, now);
                }

                noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.06);

                noiseNode.connect(noiseFilter);
                noiseFilter.connect(noiseGain);
                noiseGain.connect(analyser);

                noiseNode.start(now);
                noiseNode.stop(now + 0.08);
            } 
            else if (consonant !== "-") {
                const clickOsc = audioCtx.createOscillator();
                const clickGain = audioCtx.createGain();
                clickOsc.type = "sine";
                let startFreq = ["m","n","b","d","g"].includes(consonant) ? 95 : 280;
                
                clickOsc.frequency.setValueAtTime(startFreq, now);
                clickOsc.frequency.exponentialRampToValueAtTime(130, now + 0.04);
                clickGain.gain.setValueAtTime(0.25, now);
                clickGain.gain.exponentialRampToValueAtTime(0.01, now + 0.04);

                clickOsc.connect(clickGain);
                clickGain.connect(analyser);

                clickOsc.start(now);
                clickOsc.stop(now + 0.05);
            }
        }

        // ================= 背面波形描画 =================
        function drawWaveform() {
            requestAnimationFrame(drawWaveform);
            if (!analyser) return;

            analyser.getByteTimeDomainData(dataArray);

            canvasCtx.fillStyle = '#ffffff';
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

            canvasCtx.lineWidth = 2.5;
            canvasCtx.strokeStyle = 'rgba(0, 0, 0, 0.22)'; 
            canvasCtx.beginPath();

            const sliceWidth = canvas.width * 1.0 / bufferLength;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                const v = dataArray[i] / 128.0; 
                const centerY = canvas.height / 2;
                const targetY = centerY + (v * centerY - centerY) * 3.5;

                if (i === 0) {
                    canvasCtx.moveTo(x, targetY);
                } else {
                    canvasCtx.lineTo(x, targetY);
                }
                x += sliceWidth;
            }

            canvasCtx.lineTo(canvas.width, canvas.height / 2);
            canvasCtx.stroke();
        }

        // ================= ジョイスティック制御 =================
        function handleJoystick(e) {
            e.preventDefault();
            if (!audioCtx) initAudio();

            let joystickTouch = null;
            for (let i = 0; i < e.touches.length; i++) {
                if (e.touches[i].clientX < window.innerWidth * 0.25) {
                    joystickTouch = e.touches[i];
                    break;
                }
            }
            if (!joystickTouch) return;

            const rect = bound.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            const dx = joystickTouch.clientX - centerX;
            const dy = joystickTouch.clientY - centerY;
            const distance = Math.sqrt(dx * dx + dy * dy);
            const angleRadian = Math.atan2(dy, dx);

            let stickX = dx;
            let stickY = dy;
            if (distance > MAX_RADIUS) {
                stickX = Math.cos(angleRadian) * MAX_RADIUS;
                stickY = Math.sin(angleRadian) * MAX_RADIUS;
            }

            stick.style.transform = `translate(${stickX}px, ${stickY}px)`;

            if (distance > 18) { 
                let angleDegree = angleRadian * (180 / Math.PI);
                angleDegree = (angleDegree + 450) % 360; 

                // 5分割（1領域72度）の判定基準に正確にマッピング
                const index = Math.floor(angleDegree / 72) % 5;
                currentVowel = vowels[index];
            } else {
                currentVowel = "-";
            }
            
            updateVowelSound(currentVowel);
            updateMonitor();
        }

        function resetJoystick(e) {
            let leftTouchExists = false;
            for (let i = 0; i < e.touches.length; i++) {
                if (e.touches[i].clientX < window.innerWidth * 0.25) {
                    leftTouchExists = true;
                    break;
                }
            }
            if (!leftTouchExists) {
                stick.style.transform = `translate(0px, 0px)`;
                currentVowel = "-";
                updateVowelSound("-");
                updateMonitor();
            }
        }

        window.addEventListener('touchstart', (e) => { if (e.touches[0].clientX < window.innerWidth * 0.25) handleJoystick(e); });
        window.addEventListener('touchmove', handleJoystick);
        window.addEventListener('touchend', resetJoystick);
        window.addEventListener('touchcancel', resetJoystick);


        // ================= 子音ボタン制御 =================
        let lastActiveSound = "-";

        function checkButtonsTouch(e) {
            e.preventDefault();
            
            buttons.forEach(btn => btn.classList.remove('active'));
            let activeSound = "-";

            for (let i = 0; i < e.touches.length; i++) {
                const touch = e.touches[i];
                
                if (touch.clientX >= window.innerWidth * 0.25) {
                    buttons.forEach(btn => {
                        const rect = btn.getBoundingClientRect();
                        if (touch.clientX >= rect.left && touch.clientX <= rect.right &&
                            touch.clientY >= rect.top && touch.clientY <= rect.bottom) {
                            btn.classList.add('active');
                            activeSound = btn.getAttribute('data-sound');
                        }
                    });
                }
            }

            if (activeSound !== "-" && activeSound !== lastActiveSound) {
                triggerConsonantSound(activeSound);
            }

            currentConsonant = activeSound;
            lastActiveSound = activeSound;
            updateMonitor();
        }

        rightZone.addEventListener('touchstart', checkButtonsTouch);
        rightZone.addEventListener('touchmove', checkButtonsTouch);
        rightZone.addEventListener('touchend', checkButtonsTouch);
        rightZone.addEventListener('touchcancel', checkButtonsTouch);

    </script>
</body>
</html>
