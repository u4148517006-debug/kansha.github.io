<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phoneme Keyboard Fix</title>
    <style>
        /* 全画面リセット（横画面前提） */
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
        body { margin: 0; padding: 0; width: 100vw; height: 100vh; background: #121212; color: white; font-family: sans-serif; overflow: hidden; }
        
        /* 画面全体のレイアウト：左右に50%ずつ分割 */
        #app { display: flex; width: 100%; height: 100%; }
        
        /* ================= 左手エリア（母音） ================= */
        #left-zone { 
            width: 40%; 
            height: 100%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-right: 2px solid #333;
            background: #1a1a1a;
        }
        /* 外側の円（ベース） */
        #joystick-bound { 
            width: 180px; 
            height: 180px; 
            background: #2a2a2a; 
            border: 3px solid #555; 
            border-radius: 50%; 
            position: relative; 
        }
        /* 内側の赤いスティック */
        #joystick-stick { 
            width: 60px; 
            height: 60px; 
            background: #ff4757; 
            border-radius: 50%; 
            position: absolute; 
            /* 真ん中に配置 */
            top: 57px; 
            left: 57px; 
            pointer-events: none; /* タッチイベントの邪魔をしない */
        }
        /* ガイド文字 */
        .vowel-hint { position: absolute; font-size: 14px; color: #888; font-weight: bold; width: 20px; text-align: center; }
        #hint-a { top: 5px; left: 80px; }
        #hint-i { top: 80px; right: 5px; }
        #hint-u { bottom: 5px; left: 80px; }
        #hint-e { top: 80px; left: 5px; }
        #hint-o { top: 25px; right: 25px; }

        /* ================= 右手エリア（子音） ================= */
        #right-zone { 
            width: 60%; 
            height: 100%; 
            display: flex; 
            justify-content: space-around; /* 4本の指の列を均等に配置 */
            align-items: center; 
            padding: 10px;
            background: #151515;
        }
        
        /* 指ごとの縦一列のコンテナ */
        .finger-column { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            justify-content: center;
        }

        /* 人差し指の hj グループと bn/m グループを少し離すための隙間 */
        .index-gap {
            margin-top: 15px;
        }
        
        /* 子音ボタンの共通スタイル */
        .consonant-btn { 
            background: #2d3436; 
            border: 2px solid #4b5563; 
            color: #dfe4ea; 
            font-size: 18px; 
            font-weight: bold;
            border-radius: 12px; 
            width: 65px; 
            height: 55px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
        }
        /* 押されている時の色（マルチタッチ対応用） */
        .consonant-btn.active { 
            background: #2ed573 !important; 
            color: black; 
            border-color: #2ed573;
        }

        /* 画面上部中央のデバッグモニター */
        #monitor { 
            position: absolute; 
            top: 10px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: rgba(0,0,0,0.8); 
            padding: 8px 16px; 
            border-radius: 20px; 
            font-family: monospace; 
            font-size: 16px; 
            color: #00ff00;
            z-index: 100;
            border: 1px solid #333;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="monitor">V: - | C: -</div>

    <div id="app">
        <div id="left-zone">
            <div id="joystick-bound">
                <div id="joystick-stick"></div>
                <div class="vowel-hint" id="hint-a">a</div>
                <div class="vowel-hint" id="hint-i">i</div>
                <div class="vowel-hint" id="hint-u">u</div>
                <div class="vowel-hint" id="hint-e">e</div>
                <div class="vowel-hint" id="hint-o">o</div>
            </div>
        </div>

        <div id="right-zone">
            <div class="finger-column">
                <div class="consonant-btn" data-sound="y">y</div>
                <div class="consonant-btn" data-sound="hj">hj</div>
                <div class="consonant-btn index-gap" data-sound="bn">bn</div>
                <div class="consonant-btn" data-sound="m">m</div>
            </div>

            <div class="finger-column">
                <div class="consonant-btn" data-sound="g">g</div>
                <div class="consonant-btn" data-sound="k">k</div>
            </div>

                <div class="consonant-btn" data-sound="s">s</div>
                <div class="consonant-btn" data-sound="z">z</div>
            </div>
