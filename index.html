<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phoneme Synthesizer - Perfect Layout & Audio</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
        
        body { 
            margin: 0; 
            padding: 0; 
            width: 100vw; 
            /* JSで動的に高さを制御するため初期値は100% */
            height: 100%; 
            background: #ffffff; 
            color: #000000; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            overflow: hidden; 
            position: relative;
        }
        
        /* ================= 最背面：リアルタイム波形 ================= */
        #waveform-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; 
            pointer-events: none; 
        }

        /* ================= 前面：UIレイアウト ================= */
        #app { 
            position: absolute;
            top: 0;
            left: 0;
            display: flex; 
            width: 100%; 
            height: 100%; 
            z-index: 2; 
            background: transparent; 
        }
        
        /* 左手エリア：25% */
        #left-zone { 
            width: 25%; 
            height: 100%; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            border-right: 1px solid rgba(0, 0, 0, 0.15);
            background: rgba(255, 255, 255, 0.85); 
            position: relative;
        }

        #monitor-text { 
            font-family: monospace; 
            font-size: 15px; 
            color: #333333;
            margin-bottom: 20px;
            font-weight: 600;
            text-align: center;
            pointer-events: none;
            line-height: 1.4;
        }

        #joystick-bound { 
            width: 140px; 
            height: 140px; 
            background: #ffffff; 
            border: 2px solid #b0b0b5; 
            border-radius: 50%; 
            position: relative; 
        }
        #joystick-stick { 
            width: 46px; 
            height: 46px; 
            background: #111111; 
            border-radius: 50%; 
            position: absolute; 
            top: 45px; 
            left: 45px; 
            pointer-events: none; 
        }
        .vowel-hint { position: absolute; font-size: 15px; color: #999999; font-weight: bold; width: 20px; text-align: center; height: 20px; line-height: 20px; }

        /* 右手エリア：75%（完全ソリッドグリッド） */
        #right-zone { 
            width: 75%; 
            height: 100%; 
            display: flex; 
            justify-content: stretch; 
            align-items: stretch; 
            padding: 0; 
            background: transparent; 
        }
        
        .finger-column { 
            display: flex; 
            flex-direction: column; 
            gap: 0px; 
            flex: 1; 
        }

        .index-double-column {
            display: flex;
            gap: 0px; 
            flex: 2; 
        }
        .index-sub-column {
            display: flex;
            flex-direction: column;
            gap: 0px; 
            flex: 1;
        }

        .consonant-btn { 
            background: rgba(248, 248, 250, 0.85); 
            border: 0.5px solid rgba(0, 0, 0, 0.12); 
            color: #000000; 
            font-size: 24px; 
            font-weight: bold;
            border-radius: 0px; 
            width: 100%; 
            height: 100%; 
            display: flex; 
            align-items: center; 
            justify-content: center;
        }

        .consonant-btn.active { 
            background: #000000 !important; 
            color: #ffffff; 
            border-color: #000000;
        }
    </style>
</head>
<body>

    <canvas id="waveform-canvas"></canvas>

    <div id="app">
        <div id="left-zone">
            <div id="monitor-text">母音: - <br> 子音: -</div>
            
            <div id="joystick-bound">
                <div id="joystick-stick"></div>
                <div class="vowel-hint" style="top: 5px; left: 58px;">i</div>
                <div class="vowel-hint" style="top: 40px; right: 10px;">u</div>
                <div class="vowel-hint" style="bottom: 15px; right: 22px;">e</div>
                <div class="vowel-hint" style="bottom: 15px; left: 22px;">o</div>
                <div class="vowel-hint" style="top: 40px; left: 10px;">a</div>
            </div>
        </div>

        <div id="right-zone">
            <div class="index-double-column">
                <div class="index-sub-column">
                    <div class="consonant-btn" data-sound="y">y</div>
                    <div class="consonant-btn" data-sound="h">h</div>
                    <div class="consonant-btn" data-sound="n">n</div>
                </div>
                <div class="index-sub-column">
                    <div class="consonant-btn" data-sound="w">w</div>
                    <div class="consonant-btn" data-sound="j">j</div>
                    <div class="consonant-btn" data-sound="m">m</div>
                </div>
            </div>

            <div class="finger-column">
                <div class="consonant-btn" data-sound="g">g</div>
                <div class="consonant-btn" data-sound="k">k</div>
                <div class="consonant-btn" data-sound="b">b</div>
            </div>

            <div class="finger-column">
                <div class="consonant-btn" data-sound="r">r</div>
                <div class="consonant-btn" data-sound="s">s</div>
                <div class="consonant-btn" data-sound="z">z</div>
            </div>

            <div class="finger-column">
                <div class="consonant-btn" data-sound="p">p</div>
                <div class="consonant-btn" data-sound="t">t</div>
                <div class="consonant-btn" data-sound="d">d</div>
            </div>
        </div>
    </div>

    <script>
        const monitorText = document.getElementById('monitor-text');
        const stick = document.getElementById('joystick-stick');
        const bound = document.getElementById('joystick-bound');
        const rightZone = document.getElementById('right-zone');
        const buttons = document.querySelectorAll('.consonant-btn');
        
        const canvas = document.getElementById('waveform-canvas');
        const canvasCtx = canvas.getContext('2d');
        
        let currentVowel = "-";
        let currentConsonant = "-";
        const vowels = ["i", "u", "e", "o", "a"];
        const MAX_RADIUS = 45; 

        function updateMonitor() {
            monitorText.innerHTML = `母音: ${currentVowel}<br>子音: ${currentConsonant}`;
        }

        // ================= スマホ描画範囲の厳密取得ロジック =================
        function updateLayoutSize() {
            // アドレスバー等を除いた「実際の表示可能ピクセル」を取得
            const actualHeight = window.innerHeight;
            const actualWidth = window.innerWidth;
            
            document.body.style.height = actualHeight + "px";
            canvas.width = actualWidth;
            canvas.height = actualHeight;
        }
        // 初期化時と画面回転・リサイズ時に強制適用
        window.addEventListener('resize', updateLayoutSize);
        window.addEventListener('orientationchange', updateLayoutSize);
        updateLayoutSize();

        // ================= 音声合成システム (母音＋子音) =================
        let audioCtx = null;
        let mainGain = null;
        let voiceOsc = null;
        let filter1 = null;
        let filter2 = null;
        let analyser = null; 
        let dataArray = null;
        let bufferLength = 0;

        const formantFrequencies = {
            'i': { f1: 300,  f2: 2300 },
            'u': { f1: 300,  f2: 1200 },
            'e': { f1: 500,  f2: 1900 },
            'o': { f1: 500,  f2: 800  },
            'a': { f1: 800,  f2: 1200 }
        };

        function initAudio() {
            if (audioCtx) return;
            
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            mainGain = audioCtx.createGain();
            mainGain.gain.setValueAtTime(0, audioCtx.currentTime);

            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 2048; 
            bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength); 

            mainGain.connect(analyser);
            analyser.connect(audioCtx.destination);

            // 母音用音源（声帯の鋸歯状波）
            voiceOsc = audioCtx.createOscillator();
            voiceOsc.type = 'sawtooth';
            voiceOsc.frequency.setValueAtTime(130, audioCtx.currentTime);

            filter1 = audioCtx.createBiquadFilter();
            filter1.type = 'bandpass';
            filter1.Q.setValueAtTime(10, audioCtx.currentTime);

            filter2 = audioCtx.createBiquadFilter();
            filter2.type = 'bandpass';
            filter2.Q.setValueAtTime(10, audioCtx.currentTime);

            voiceOsc.connect(filter1);
            voiceOsc.connect(filter2);
            filter1.connect(mainGain);
            filter2.connect(mainGain);

            voiceOsc.start();
            drawWaveform();
        }

        // 母音の更新
        function updateVowelSound(vowel) {
            if (!audioCtx) initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (vowel === "-") {
                mainGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.04);
            } else {
                const freq = formantFrequencies[vowel];
                filter1.frequency.setTargetAtTime(freq.f1, audioCtx.currentTime, 0.05);
                filter2.frequency.setTargetAtTime(freq.f2, audioCtx.currentTime, 0.05);
                mainGain.gain.setTargetAtTime(0.25, audioCtx.currentTime, 0.02); 
            }
        }

        // ★新規：子音のアタック音をトリガーする関数
        function triggerConsonantSound(consonant) {
            if (!audioCtx) initAudio();
            const now = audioCtx.currentTime;

            // 1. ノイズ系（s, k, t, p, h）用のバッファノイズ生成
            if (["s", "k", "t", "p", "h"].includes(consonant)) {
                const bufferSize = audioCtx.sampleRate * 0.08; // 0.08秒の短いノイズ
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noiseNode = audioCtx.createBufferSource();
                noiseNode.buffer = buffer;

                const noiseFilter = audioCtx.createBiquadFilter();
                const noiseGain = audioCtx.createGain();

                // 子音ごとの特性フィルター設定
                if (consonant === "s") {
                    noiseFilter.type = "highpass";
                    noiseFilter.frequency.setValueAtTime(6000, now); // 高音の擦れ音
                    noiseGain.gain.setValueAtTime(0.3, now);
                } else if (consonant === "h") {
                    noiseFilter.type = "bandpass";
                    noiseFilter.frequency.setValueAtTime(2500, now); // 息の音
                    noiseGain.gain.setValueAtTime(0.2, now);
                } else { // k, t, p 破裂音系
                    noiseFilter.type = "bandpass";
                    noiseFilter.frequency.setValueAtTime(1500, now);
                    noiseGain.gain.setValueAtTime(0.4, now);
                }

                // 急激に減衰させる（エンベロープ）
                noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.06);

                noiseNode.connect(noiseFilter);
                noiseFilter.connect(noiseGain);
                noiseGain.connect(analyser); // 波形に映るようアナライザーへ接続

                noiseNode.start(now);
                noiseNode.stop(now + 0.08);
            } 
            // 2. 有声音・半母音系（ピッチの急変やクリックによるアタック感）
            else if (consonant !== "-") {
                const clickOsc = audioCtx.createOscillator();
                const clickGain = audioCtx.createGain();
                
                clickOsc.type = "sine";
                // m, n などの鼻音は低め、y, w などの半母音は少し高めの周波数から落とす
                let startFreq = ["m","n","b","d","g"].includes(consonant) ? 90 : 300;
                
                clickOsc.frequency.setValueAtTime(startFreq, now);
                clickOsc.frequency.exponentialRampToValueAtTime(130, now + 0.05);

                clickGain.gain.setValueAtTime(0.3, now);
                clickGain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);

                clickOsc.connect(clickGain);
                clickGain.connect(analyser);

                clickOsc.start(now);
                clickOsc.stop(now + 0.06);
            }
        }

        // ================= 背面波形描画 =================
        function drawWaveform() {
            requestAnimationFrame(drawWaveform);
            if (!analyser) return;

            analyser.getByteTimeDomainData(dataArray);

            canvasCtx.fillStyle = '#ffffff';
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

            canvasCtx.lineWidth = 2.5;
            canvasCtx.strokeStyle = 'rgba(0, 0, 0, 0.25)'; 
            canvasCtx.beginPath();

            const sliceWidth = canvas.width * 1.0 / bufferLength;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                const v = dataArray[i] / 128.0; 
                const centerY = canvas.height / 2;
                // 3.5倍のダイナミック振幅
                const targetY = centerY + (v * centerY - centerY) * 3.5;

                if (i === 0) {
                    canvasCtx.moveTo(x, targetY);
                } else {
                    canvasCtx.lineTo(x, targetY);
                }
                x += sliceWidth;
            }

            canvasCtx.lineTo(canvas.width, canvas.height / 2);
            canvasCtx.stroke();
        }

        // ================= ジョイスティック制御 =================
        function handleJoystick(e) {
            e.preventDefault();
            if (!audioCtx) initAudio();

            let joystickTouch = null;
            for (let i = 0; i < e.touches.length
